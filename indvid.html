<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Videos</title>
    <link rel="stylesheet" href="style_vd.css" media="all" />
    <script
      src="https://kit.fontawesome.com/8ef245de09.js"
      crossorigin="anonymous"
      async
    ></script>
  </head>
  <body>
    <div class="wrapper">
      <div class="loading">
        <div class="bounceball"></div>
        <div class="text"><p class="text1">Loading Videos....</p></div>
      </div>
    </div>
    <div class="container1">
      <nav class="navbar">
        <h1 class="logo">
          <img src="images/Frame 1.svg" alt="GDSC" loading="lazy" />
        </h1>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="#" class="active">Videos</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="events.html">Events</a></li>
          <li>
            <a
              class="btn"
              href="https://github.com/GDSC-IIIT-Kalyani"
              target="_blank"
              >Join Us</a
            >
          </li>
        </ul>
        <div class="toggle_btn"><i class="fas fa-bars"></i></div>
      </nav>
      <div class="video-gallery">
        <h1>GDSC Journey: Videos That Inspire</h1>
        <p>
          Explore our Video Gallery, featuring highlights from workshops and
          events at GDSC.
        </p>
        <div class="video">
          <iframe
            loading="lazy"
            src="https://www.youtube.com/embed/P-PWfLDBNNY"
            title="Building Revolutionary App with GitHub"
          ></iframe>
        </div>
        <div class="video">
          <iframe
            loading="lazy"
            src="https://www.youtube.com/embed/mJvjk68QKeA"
            title="Craft your Winning Proposal"
          ></iframe>
        </div>
        <!-- Add similar lazy loading for other videos -->
      </div>
      <footer class="footer">
        <div class="container">
          <div class="row">
            <div class="footer-col">
              <h4>Quick Links</h4>
              <ul>
                <li>
                  <a
                    href="https://discord.com/channels/799321288555888683/799321289143484468"
                    >FAQ</a
                  >
                </li>
                <li><a href="events.html">Events</a></li>
                <li><a href="#" class="active">Videos</a></li>
                <li>
                  <a href="https://gdsc.bio.link/" target="_blank"
                    >Contact Us</a
                  >
                </li>
              </ul>
            </div>
            <div class="footer-col">
              <h4>Follow Us</h4>
              <div class="social-links">
                <a href="https://www.facebook.com/iiitkalyani/" target="_blank"
                  ><i class="fab fa-facebook-f"></i
                ></a>
                <a href="https://twitter.com/gdsciiitkalyani" target="_blank"
                  ><i class="fab fa-x-twitter"></i
                ></a>
                <a
                  href="https://www.instagram.com/gdsciiitkalyani/?hl=en"
                  target="_blank"
                  ><i class="fab fa-instagram"></i
                ></a>
                <a
                  href="https://www.linkedin.com/company/gdsc-iiit-kalyani/?originalSubdomain=in"
                  target="_blank"
                  ><i class="fab fa-linkedin-in"></i
                ></a>
              </div>
            </div>
          </div>
        </div>
      </footer>
    </div>
    <script>
      window.addEventListener("load", function () {
        document.querySelector(".wrapper").style.display = "none";
        document.querySelector(".container1").style.visibility = "visible";
        document.body.style.overflowY = "auto";
      });

      const menuBtn = document.querySelector(".toggle_btn");
      const navlinks = document.querySelector(".nav-links");
      menuBtn.addEventListener("click", () => {
        navlinks.classList.toggle("mobile-menu");
      });
    </script>
  </body>
</html>
